<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Attendance System (Kyubiks)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        .list-container { margin-top: 20px; width: 100%; max-width: 400px; }
        ul { list-style: none; padding: 0; }
        li { background: #fff; margin-bottom: 5px; padding: 10px; border-radius: 4px; border-left: 5px solid #28a745; display: flex; justify-content: space-between; }
        .time { font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Attendance</h2>
    <input type="text" id="studentName" placeholder="Enter Student Name">
    <button onclick="submitAttendance()">Mark Attendance</button>
</div>

<div class="list-container">
    <h3>Today's Attendance</h3>
    <ul id="attendanceList"></ul>
</div>

<script>
    // --- CONFIGURATION ---
    const GITHUB_TOKEN = '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'; 
    const REPO_OWNER = 'ShreeSiddhababaSecondary';
    const REPO_NAME = 'class_attend';
    const FILE_PATH = 'attendance.json';

    const today = new Date().toISOString().split('T')[0];

    // Initialize list on load
    window.onload = fetchAttendance;

    async function fetchAttendance() {
        const list = document.getElementById('attendanceList');
        list.innerHTML = "Loading...";
        
        try {
            const data = await getFileContent();
            const attendanceRecord = data ? JSON.parse(atob(data.content)) : [];
            
            // Filter records for today only
            const todaysRecords = attendanceRecord.filter(record => record.date === today);
            
            list.innerHTML = "";
            todaysRecords.forEach(record => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${record.name}</span> <span class="time">${record.time}</span>`;
                list.appendChild(li);
            });
        } catch (error) {
            list.innerHTML = "No records found for today.";
        }
    }

    async function submitAttendance() {
        const nameInput = document.getElementById('studentName');
        const name = nameInput.value.trim();
        
        if (!name) return alert("Please enter a name");

        const time = new Date().toLocaleTimeString();
        const newEntry = { name, date: today, time };

        try {
            const fileData = await getFileContent();
            let attendanceArray = [];
            let sha = null;

            if (fileData) {
                attendanceArray = JSON.parse(atob(fileData.content));
                sha = fileData.sha;
            }

            // Check if student already attended today
            const alreadyAttended = attendanceArray.find(r => r.name === name && r.date === today);
            if (alreadyAttended) {
                alert("This student has already been marked present today.");
                return;
            }

            attendanceArray.push(newEntry);

            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Attendance for ${name} on ${today}`,
                    content: btoa(JSON.stringify(attendanceArray, null, 2)),
                    sha: sha
                })
            });

            if (response.ok) {
                alert("Attendance recorded!");
                nameInput.value = "";
                fetchAttendance();
            } else {
                alert("Error saving to GitHub.");
            }
        } catch (error) {
            console.error(error);
        }
    }

    async function getFileContent() {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        return response.ok ? await response.json() : null;
    }
</script>

</body>
</html>
